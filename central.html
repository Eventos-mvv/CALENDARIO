<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Central de Atendimento · Eventos MVV</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<!--
  CENTRAL DE ATENDIMENTO — Eventos MVV
  Lê os pedidos que o chat "Fale com a coordenação" (atendimento.html) grava no Firestore.
  Só entra quem fizer login com uma conta Google listada em EQUIPE (e nas regras do Firestore).
  ?demo no endereço mostra a tela com pedidos fictícios, sem acessar o Firebase.
-->
<style>
:root{
  --ink:#1d1a1b;--ink-2:#4a4446;--muted:#7c7476;--line:#e7e2e3;--line-2:#f1eded;
  --bg:#faf9f9;--panel:#fff;--brand:#7a1c30;--brand-2:#5e1526;--brand-tint:#f6edef;
  --novo:#b45309;--andamento:#2f5d8a;--resolvido:#1f7a4d;--risco:#b42318;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--ink);font:14px/1.5 'Libre Franklin',system-ui,sans-serif;font-feature-settings:'tnum'}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.oculto{display:none!important}

/* barra superior */
.top{height:56px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 24px;position:sticky;top:0;z-index:5}
.top img{width:26px;height:26px}
.top .marca{font-weight:700;letter-spacing:-.005em}
.top .sep{width:1px;height:20px;background:var(--line)}
.top .area{color:var(--muted)}
.top .conta{margin-left:auto;display:flex;align-items:center;gap:14px;color:var(--ink-2);font-size:13px}
.top .conta button{background:none;border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
.top .conta button:hover{border-color:var(--ink-2)}

/* login */
.login{min-height:calc(100vh - 56px);display:grid;place-items:center;padding:24px}
.login-box{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:32px}
.login-box h1{font-size:20px;margin:0 0 6px;letter-spacing:-.01em}
.login-box p{margin:0 0 24px;color:var(--muted)}
.g-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--line);background:#fff;border-radius:6px;padding:10px 14px;font-weight:600;cursor:pointer}
.g-btn:hover{border-color:var(--ink-2)}
.erro{color:var(--risco);font-size:13px;margin-top:14px}

/* conteúdo */
.wrap{max-width:1320px;margin:0 auto;padding:24px}
.titulo{display:flex;align-items:baseline;gap:12px;margin-bottom:18px}
.titulo h1{font-size:22px;margin:0;letter-spacing:-.015em}
.titulo span{color:var(--muted)}

/* indicadores: uma faixa só, divisórias finas */
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:20px}
.stat{padding:14px 18px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat dt{color:var(--muted);font-size:12.5px}
.stat dd{margin:2px 0 0;font-size:24px;font-weight:600;letter-spacing:-.02em}
.stat small{display:block;color:var(--muted);font-size:12px;font-weight:400;letter-spacing:0}
@media(max-width:980px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{border-left:0;border-top:1px solid var(--line)}.stat:nth-child(-n+2){border-top:0}.stat:nth-child(even){border-left:1px solid var(--line)}}

/* filtros */
.ferramentas{display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line);margin-bottom:0;flex-wrap:wrap}
.abas{display:flex;gap:2px}
.abas button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;color:var(--muted);font-weight:600;cursor:pointer;margin-bottom:-1px}
.abas button:hover{color:var(--ink)}
.abas button.on{color:var(--ink);border-bottom-color:var(--brand)}
.abas b{font-weight:500;color:var(--muted);margin-left:4px}
.busca{margin-left:auto;width:280px;max-width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 10px;background:#fff;margin-bottom:6px}
.busca:focus{outline:none;border-color:var(--ink-2)}

/* tabela + painel */
.corpo{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:20px;align-items:start;margin-top:16px}
.corpo.sem-det{grid-template-columns:minmax(0,1fr)}
@media(max-width:1100px){.corpo{grid-template-columns:1fr}}
.tabela{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:600;font-size:12px;color:var(--muted);padding:9px 14px;border-bottom:1px solid var(--line);background:var(--bg);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line-2);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:#fcfbfb}
tbody tr.sel td{background:var(--brand-tint)}
.prot{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px;white-space:nowrap}
.nome{font-weight:600}
.resumo{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.st{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:13px}
.st::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.st-novo{color:var(--novo)}.st-andamento{color:var(--andamento)}.st-resolvido{color:var(--resolvido)}
.st span{color:var(--ink-2)}
.prio{font-size:12px;font-weight:600;color:var(--risco)}
.quando{white-space:nowrap;color:var(--ink-2);font-size:13px}
.vazio{padding:40px 16px;text-align:center;color:var(--muted)}
@media(max-width:720px){.col-ev,.col-quando{display:none}}

.det{background:var(--panel);border:1px solid var(--line);border-radius:10px;position:sticky;top:76px}
.det-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:10px}
.det-head h2{margin:0;font-size:17px;letter-spacing:-.01em}
.det-head .prot{display:block;margin-top:2px}
.det-head .fechar{margin-left:auto;background:none;border:0;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:2px 4px}
.det-sec{padding:14px 18px;border-bottom:1px solid var(--line)}
.det-sec:last-child{border-bottom:0}
.det-sec h3{font-size:12px;color:var(--muted);font-weight:600;margin:0 0 8px}
dl.info{display:grid;grid-template-columns:100px 1fr;gap:6px 12px;margin:0}
dl.info dt{color:var(--muted)}dl.info dd{margin:0}
.mensagem{white-space:pre-wrap;line-height:1.55}
.acoes{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 12px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink-2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-2)}
.campos{display:grid;grid-template-columns:100px 1fr;gap:8px 12px;align-items:center}
.campos label{color:var(--muted)}
.campos input,.campos select{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff;width:100%}
.campos input:focus,.campos select:focus,textarea:focus{outline:none;border-color:var(--ink-2)}
.notas{list-style:none;margin:0 0 10px;padding:0}
.notas li{padding:8px 0;border-bottom:1px solid var(--line-2)}
.notas li:last-child{border-bottom:0}
.notas small{display:block;color:var(--muted);font-size:12px}
.nota-nova{display:grid;gap:8px}
.nota-nova textarea{border:1px solid var(--line);border-radius:6px;padding:8px 10px;resize:vertical;min-height:60px}
.nota-nova .btn{justify-self:end}
.perigo{background:none;border:0;color:var(--risco);cursor:pointer;padding:0;font-size:13px}
.nota-av{font-weight:600}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media(max-width:720px){
  .top{padding:0 16px}.top .sep,.top .area{display:none}
  .top .conta span{max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wrap{padding:18px 16px}
  .ferramentas{gap:8px}
  .abas{width:100%;overflow-x:auto;scrollbar-width:none}
  .abas button{white-space:nowrap;padding:10px 10px}
  .busca{margin:4px 0 10px;width:100%}
  td,th{padding:10px}
}
</style>
</head>
<body>
<header class="top">
  <img src="favicon.svg" alt="">
  <span class="marca">Eventos MVV</span>
  <span class="sep"></span>
  <span class="area">Central de Atendimento</span>
  <div class="conta oculto" id="conta"><span id="quem"></span><button id="sair">Sair</button></div>
</header>

<section class="login" id="telaEntrar">
  <div class="login-box">
    <h1>Entrar</h1>
    <p>Acesso restrito à coordenação de Eventos do Ministério Verbo da Vida.</p>
    <button class="g-btn" id="entrar">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.5 30.2 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.8 6C12.4 13.5 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.7l-7.8-6C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.8-6z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.6-4-13.5-9.7l-7.8 6C6.6 42.6 14.6 48 24 48z"/></svg>
      Entrar com Google
    </button>
    <div class="erro" id="erroEntrar"></div>
  </div>
</section>

<main class="wrap oculto" id="telaCentral">
  <div class="titulo"><h1>Atendimentos</h1><span id="atualizado"></span></div>
  <dl class="stats" id="stats"></dl>
  <div class="ferramentas">
    <div class="abas" id="abas"></div>
    <input class="busca" id="busca" type="search" placeholder="Buscar nome, protocolo ou evento">
  </div>
  <div class="corpo sem-det" id="corpo">
    <div class="tabela">
      <table>
        <thead><tr><th>Protocolo</th><th>Solicitante</th><th class="col-ev">Evento</th><th>Situação</th><th class="col-quando">Recebido</th></tr></thead>
        <tbody id="linhas"></tbody>
      </table>
    </div>
    <aside class="det oculto" id="det"></aside>
  </div>
</main>

<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBgcNwoy086jlADtKVsdaTUXBJGzntZKfs",
  authDomain: "eventos-mvv-atendimento.firebaseapp.com",
  projectId: "eventos-mvv-atendimento",
  storageBucket: "eventos-mvv-atendimento.firebasestorage.app",
  messagingSenderId: "184710879550",
  appId: "1:184710879550:web:c25a0e6ceec416698c346f"
};
/* contas que podem entrar (precisam estar também nas regras do Firestore) */
const EQUIPE = ['eventos@verbodavida.com'];
const DEMO = new URLSearchParams(location.search).has('demo');

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST = {novo:'Novo', andamento:'Em andamento', resolvido:'Resolvido'};
const dataHora = ms => ms ? new Date(ms).toLocaleString('pt-BR', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'}) : '—';
function relativo(ms){
  const m = Math.round((Date.now() - ms) / 60000);
  if(m < 1) return 'agora'; if(m < 60) return `há ${m} min`;
  const h = Math.round(m / 60); if(h < 24) return `há ${h} h`;
  const d = Math.round(h / 24); return d === 1 ? 'ontem' : d < 7 ? `há ${d} dias` : dataHora(ms).slice(0, 5);
}
const dur = ms => { if(ms == null) return '—'; const m = Math.round(ms / 60000); return m < 60 ? `${m} min` : m < 1440 ? `${(m / 60).toFixed(1).replace('.', ',')} h` : `${(m / 1440).toFixed(1).replace('.', ',')} d`; };
const pct = (a, b) => b ? Math.round(a / b * 100) + '%' : '—';

let PEDIDOS = [], filtro = 'abertos', selId = null, parar = null, ref = null, usuario = null;

/* ---------- acesso ---------- */
if(DEMO){
  usuario = {email:'demonstracao', displayName:'Demonstração'};
  $('telaEntrar').classList.add('oculto'); $('telaCentral').classList.remove('oculto');
  $('conta').classList.remove('oculto'); $('quem').textContent = 'Modo demonstração (dados fictícios)'; $('sair').classList.add('oculto');
  const h = Date.now(), H = 3600e3;
  PEDIDOS = [
    {id:'1', protocolo:'K7Q2M', nome:'Maria Souza', canal:'Link de atendimento', evento:'Conferência de Ministros Nordeste 2027', assunto:'Inscrição / Pagamento', prioridade:'atencao', status:'novo', mensagem:'Fiz o Pix ontem à noite, no nome de Maria Souza, e ainda não chegou a confirmação.', criadoEm:h-0.4*H, notas:[]},
    {id:'2', protocolo:'K7P9A', nome:'Pr. João Batista', canal:'Link de atendimento', evento:'Geral / Outro', assunto:'Caravanas', prioridade:'normal', status:'andamento', responsavel:'Djonh', mensagem:'Igreja Verbo da Vida Patos, cerca de 40 pessoas para a RPD.', criadoEm:h-5*H, primeiraRespostaEm:h-4.2*H, notas:[{texto:'Enviei o formulário de caravanas pelo WhatsApp.', por:'Djonh', em:h-4.2*H}]},
    {id:'3', protocolo:'K7N1C', nome:'Ana Paula', canal:'Autoatendimento', evento:'Reunião Anual de Pastores e Diretorias 2027', assunto:'Datas / Calendário', prioridade:'normal', status:'resolvido', mensagem:'Resolvido no autoatendimento: data e local: RPD', criadoEm:h-9*H, primeiraRespostaEm:h-9*H, resolvidoEm:h-9*H, satisfacao:{nota:5}},
    {id:'4', protocolo:'K7M8D', nome:'Carlos Henrique', canal:'Autoatendimento', evento:'Geral / Outro', assunto:'Reembolso / Titularidade', prioridade:'normal', status:'resolvido', mensagem:'Resolvido no autoatendimento: troca de titularidade', criadoEm:h-26*H, primeiraRespostaEm:h-26*H, resolvidoEm:h-26*H, satisfacao:{nota:4}},
    {id:'5', protocolo:'K7L3F', nome:'Débora Lima', canal:'Link de atendimento', evento:'Conferência de Mulheres 2027', assunto:'Outros', prioridade:'normal', status:'resolvido', responsavel:'Djonh', mensagem:'Gostaria de saber se crianças podem acompanhar.', criadoEm:h-50*H, primeiraRespostaEm:h-48*H, resolvidoEm:h-47*H, notas:[{texto:'Respondido pelo WhatsApp.', por:'Djonh', em:h-47*H}]},
    {id:'6', protocolo:'K7K0G', nome:'Rafael Torres', canal:'Autoatendimento', evento:'Conferência de Ministros Sul 2027', assunto:'Datas / Calendário', prioridade:'normal', status:'resolvido', mensagem:'Resolvido no autoatendimento: data e local: CMSUL', criadoEm:h-80*H, primeiraRespostaEm:h-80*H, resolvidoEm:h-80*H, satisfacao:{nota:4}}
  ];
  desenhar();
} else {
  firebase.initializeApp(FIREBASE_CONFIG);
  const auth = firebase.auth(), db = firebase.firestore();
  ref = db.collection('chamados');
  $('entrar').onclick = async () => {
    $('erroEntrar').textContent = '';
    try { await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
    catch(e){ $('erroEntrar').textContent = e.code === 'auth/unauthorized-domain'
      ? 'Este endereço ainda não está autorizado no Firebase (Authentication › Configurações › Domínios autorizados).'
      : 'Não foi possível entrar. ' + (e.message || e.code); }
  };
  $('sair').onclick = () => auth.signOut();
  auth.onAuthStateChanged(u => {
    if(parar){ parar(); parar = null; }
    const ok = u && EQUIPE.includes((u.email || '').toLowerCase());
    usuario = ok ? u : null;
    $('telaEntrar').classList.toggle('oculto', !!ok);
    $('telaCentral').classList.toggle('oculto', !ok);
    $('conta').classList.toggle('oculto', !ok);
    $('quem').textContent = ok ? u.email : '';
    if(u && !ok){ $('erroEntrar').textContent = `A conta ${u.email} não tem acesso.`; auth.signOut(); return; }
    if(ok) parar = ref.orderBy('criadoEm', 'desc').limit(500).onSnapshot(snap => {
      PEDIDOS = snap.docs.map(d => ({id:d.id, ...d.data()})); desenhar();
    }, e => { $('linhas').innerHTML = `<tr><td colspan="5" class="vazio">Não foi possível ler os pedidos (${esc(e.message)}).</td></tr>`; });
  });
}

async function salvar(id, d){
  const p = PEDIDOS.find(x => x.id === id);
  if(DEMO){ Object.assign(p, d, {atualizadoEm:Date.now()}); desenhar(); return; }
  try { await ref.doc(id).update({...d, atualizadoEm:Date.now()}); }
  catch(e){ alert('Não foi possível salvar: ' + e.message); }
}

/* ---------- tela ---------- */
function desenhar(){
  const agora = Date.now(), ult = PEDIDOS.filter(p => p.criadoEm >= agora - 30 * 864e5);
  const abertos = PEDIDOS.filter(p => p.status !== 'resolvido');
  const auto = ult.filter(p => p.canal === 'Autoatendimento');
  const notas = ult.map(p => p.satisfacao && p.satisfacao.nota).filter(Boolean);
  const media = notas.length ? (notas.reduce((a, b) => a + b, 0) / notas.length).toFixed(1).replace('.', ',') : '—';
  const tempos = ult.filter(p => p.primeiraRespostaEm && p.canal !== 'Autoatendimento').map(p => p.primeiraRespostaEm - p.criadoEm);
  const tMed = tempos.length ? tempos.reduce((a, b) => a + b, 0) / tempos.length : null;
  $('atualizado').textContent = 'Últimos 30 dias';
  $('stats').innerHTML = `
    <div class="stat"><dt>Em aberto</dt><dd>${abertos.length}<small>${abertos.filter(p => p.prioridade === 'atencao').length} com prioridade</small></dd></div>
    <div class="stat"><dt>Recebidos</dt><dd>${ult.length}<small>pelo chat do calendário</small></dd></div>
    <div class="stat"><dt>Resolvidos pelo chat</dt><dd>${pct(auto.length, ult.length)}<small>${auto.length} sem atendimento da equipe</small></dd></div>
    <div class="stat"><dt>Satisfação</dt><dd>${media}<small>média de ${notas.length} avaliações (1 a 5)</small></dd></div>
    <div class="stat"><dt>Primeira resposta</dt><dd>${dur(tMed)}<small>tempo médio da equipe</small></dd></div>`;

  const cont = {abertos:abertos.length, novo:PEDIDOS.filter(p => p.status === 'novo').length, andamento:PEDIDOS.filter(p => p.status === 'andamento').length, resolvido:PEDIDOS.filter(p => p.status === 'resolvido').length, todos:PEDIDOS.length};
  const F = {abertos:'Em aberto', novo:'Novos', andamento:'Em andamento', resolvido:'Resolvidos', todos:'Todos'};
  $('abas').innerHTML = Object.entries(F).map(([k, v]) => `<button data-f="${k}" class="${k === filtro ? 'on' : ''}">${v}<b>${cont[k]}</b></button>`).join('');
  $('abas').querySelectorAll('button').forEach(b => b.onclick = () => { filtro = b.dataset.f; desenhar(); });

  const q = $('busca').value.trim().toLowerCase();
  const vis = PEDIDOS
    .filter(p => filtro === 'todos' || (filtro === 'abertos' ? p.status !== 'resolvido' : p.status === filtro))
    .filter(p => !q || [p.nome, p.protocolo, p.evento, p.assunto, p.mensagem].join(' ').toLowerCase().includes(q));
  $('linhas').innerHTML = vis.length ? vis.map(p => `
    <tr data-id="${p.id}" class="${p.id === selId ? 'sel' : ''}">
      <td class="prot">${esc(p.protocolo)}</td>
      <td><div class="nome">${esc(p.nome || 'Sem nome')}</div><div class="resumo">${esc(p.assunto)} · ${esc((p.mensagem || '').split('\n')[0])}</div></td>
      <td class="col-ev">${p.evento && p.evento !== 'Geral / Outro' ? esc(p.evento) : '<span style="color:var(--muted)">—</span>'}</td>
      <td><span class="st st-${esc(p.status)}"><span>${ST[p.status] || esc(p.status)}</span></span>${p.prioridade === 'atencao' && p.status !== 'resolvido' ? '<div class="prio">Prioridade</div>' : ''}</td>
      <td class="col-quando quando" title="${dataHora(p.criadoEm)}">${relativo(p.criadoEm)}</td>
    </tr>`).join('') : `<tr><td colspan="5" class="vazio">${q ? 'Nenhum pedido encontrado.' : 'Nenhum pedido nesta lista.'}</td></tr>`;
  $('linhas').querySelectorAll('tr[data-id]').forEach(tr => tr.onclick = () => { selId = tr.dataset.id; desenhar(); });
  detalhe();
}
$('busca').oninput = desenhar;

function detalhe(){
  const p = PEDIDOS.find(x => x.id === selId);
  $('det').classList.toggle('oculto', !p);
  $('corpo').classList.toggle('sem-det', !p);
  if(!p) return;
  const zap = (p.contato || '').replace(/\D/g, '');
  const auto = p.canal === 'Autoatendimento';
  $('det').innerHTML = `
    <div class="det-head"><div><h2>${esc(p.nome || 'Sem nome')}</h2><span class="prot">Protocolo ${esc(p.protocolo)} · ${dataHora(p.criadoEm)}</span></div><button class="fechar" id="fechar" aria-label="Fechar">×</button></div>
    <div class="det-sec">
      <dl class="info">
        <dt>Situação</dt><dd><span class="st st-${esc(p.status)}"><span>${ST[p.status] || esc(p.status)}</span></span></dd>
        <dt>Assunto</dt><dd>${esc(p.assunto)}</dd>
        <dt>Evento</dt><dd>${esc(p.evento || '—')}</dd>
        <dt>Origem</dt><dd>${auto ? 'Resolvido pelo chat' : 'Chat do calendário'}</dd>
        ${p.contato ? `<dt>WhatsApp</dt><dd>${esc(p.contato)}</dd>` : ''}
        ${p.satisfacao ? `<dt>Avaliação</dt><dd><span class="nota-av">${p.satisfacao.nota}</span> de 5</dd>` : ''}
        ${p.resolvidoEm ? `<dt>Concluído</dt><dd>${dataHora(p.resolvidoEm)}</dd>` : ''}
      </dl>
    </div>
    <div class="det-sec"><h3>Mensagem</h3><div class="mensagem">${esc(p.mensagem)}</div></div>
    ${auto ? '' : `
    <div class="det-sec">
      <div class="acoes">
        ${p.status === 'novo' ? '<button class="btn" data-st="andamento">Assumir</button>' : ''}
        ${p.status !== 'resolvido' ? '<button class="btn pri" data-st="resolvido">Concluir</button>' : '<button class="btn" data-st="andamento">Reabrir</button>'}
        ${zap ? `<a class="btn" href="https://wa.me/${zap.length <= 11 ? '55' + zap : zap}" target="_blank" rel="noopener">WhatsApp</a>` : ''}
      </div>
    </div>
    <div class="det-sec">
      <div class="campos">
        <label for="resp">Responsável</label><input id="resp" value="${esc(p.responsavel)}" placeholder="Ninguém">
        <label for="prio">Prioridade</label><select id="prio"><option value="normal">Normal</option><option value="atencao"${p.prioridade === 'atencao' ? ' selected' : ''}>Alta</option></select>
      </div>
    </div>
    <div class="det-sec">
      <h3>Anotações internas</h3>
      <ul class="notas">${(p.notas || []).map(n => `<li>${esc(n.texto)}<small>${esc(n.por || '')} · ${dataHora(n.em)}</small></li>`).join('') || '<li><small>Sem anotações.</small></li>'}</ul>
      <div class="nota-nova"><textarea id="nota" placeholder="Registrar o que foi feito"></textarea><button class="btn" id="addNota">Adicionar</button></div>
    </div>`}
    <div class="det-sec"><button class="perigo" id="apagar">Excluir pedido</button></div>`;
  $('fechar').onclick = () => { selId = null; desenhar(); };
  $('det').querySelectorAll('[data-st]').forEach(b => b.onclick = () => {
    const st = b.dataset.st, t = Date.now(), d = {status:st, resolvidoEm: st === 'resolvido' ? t : null};
    if(!p.primeiraRespostaEm) d.primeiraRespostaEm = t;
    if(st === 'andamento' && !p.responsavel) d.responsavel = (usuario.displayName || usuario.email).split(' ')[0];
    salvar(p.id, d);
  });
  if($('resp')) $('resp').onchange = e => salvar(p.id, {responsavel:e.target.value.trim()});
  if($('prio')) $('prio').onchange = e => salvar(p.id, {prioridade:e.target.value});
  if($('addNota')) $('addNota').onclick = () => {
    const t = $('nota').value.trim(); if(!t) return;
    salvar(p.id, {notas:[...(p.notas || []), {texto:t, por:usuario.displayName || usuario.email, em:Date.now()}]});
  };
  $('apagar').onclick = () => {
    if(!confirm('Excluir este pedido? Não é possível desfazer.')) return;
    if(DEMO){ PEDIDOS = PEDIDOS.filter(x => x.id !== p.id); selId = null; desenhar(); return; }
    ref.doc(p.id).delete(); selId = null;
  };
}
</script>
</body>
</html>
