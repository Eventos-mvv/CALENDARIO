<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fale com a Coordenação · Eventos MVV</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet">

<!--
  FALE COM A COORDENAÇÃO — página pública ligada à Central de Atendimento.
  - Sem FIREBASE_CONFIG: modo demonstração (o pedido aparece na Central aberta no mesmo navegador).
  - Com FIREBASE_CONFIG: use o MESMO projeto da Central (as regras estão no topo do central-atendimento.html).
  - Abra com #auto no final do endereço para ver uma conversa de exemplo rodando sozinha (em português).
  - Os eventos vêm do eventos.json gerado junto com o calendário (mesmos dados do site).
  - Parâmetros: ?lang=pt|en|es|fr|de|it|ja  e  ?ev=<id do evento> (abre já falando daquele evento).
  - O que é gravado na Central (assunto, evento) fica sempre em português.
-->
<style>
:root{--vinho:#7a1c30;--vinho-esc:#4e0f1e;--vinho-claro:#f7eaed;--bg:#f4efef;--txt:#241a1c;--muted:#7d7073;--borda:#e9e0e2}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 'Libre Franklin',system-ui,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:520px;height:100dvh;display:flex;flex-direction:column;background:#fbf8f8;box-shadow:0 0 40px rgba(90,18,32,.08)}
header{background:linear-gradient(180deg,var(--vinho-esc),var(--vinho));color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:12px;background:#fff;display:grid;place-items:center;flex:none}
.logo img{width:30px;height:30px;display:block}
header b{display:block;font-weight:700}
header small{opacity:.85;font-size:12px}
header small::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:#6ee7a0;margin-right:5px;vertical-align:1px}
.fechar-chat{margin-left:auto;background:none;border:0;color:#fff;font-size:26px;line-height:1;cursor:pointer;display:none}
.embutido .fechar-chat{display:block}
.embutido body{background:#fbf8f8}.embutido .app{max-width:none;box-shadow:none}
#chat{flex:1;overflow-y:auto;padding:16px 14px 8px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:86%;padding:10px 13px;border-radius:16px;animation:in .25s ease;word-wrap:break-word}
.bot{background:#fff;border:1px solid var(--borda);border-bottom-left-radius:4px;align-self:flex-start}
.eu{background:var(--vinho);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
.bot a{color:var(--vinho);font-weight:600}
.link-btn{display:inline-block;margin-top:8px;background:var(--vinho-claro);color:var(--vinho);padding:8px 12px;border-radius:10px;text-decoration:none;font-weight:600}
.link-btn.forte{background:var(--vinho);color:#fff}
.links{display:flex;flex-wrap:wrap;gap:8px}
/* cartão de evento */
.ev{border-left:4px solid var(--cor,var(--vinho));padding-left:10px}
.ev .sigla{font-weight:700;color:var(--cor,var(--vinho));letter-spacing:.02em}
.ev .nome{font-weight:600;margin:2px 0 6px}
.ev .data{font-size:18px;font-weight:700;color:var(--vinho)}
.ev .linha{color:var(--muted);font-size:13.5px}
.ev .falta{display:inline-block;margin-top:6px;background:var(--vinho-claro);color:var(--vinho);font-weight:700;font-size:13px;padding:3px 9px;border-radius:99px}
.ev .obs{font-size:13.5px;color:var(--muted);margin-top:6px}
.agenda{margin:6px 0 0;padding:0;list-style:none}
.agenda li{padding:7px 0;border-top:1px solid var(--borda)}
.agenda li:first-child{border-top:0}
.agenda b{color:var(--vinho)}
.agenda span{display:block;font-size:13px;color:var(--muted)}
.digitando{align-self:flex-start;background:#fff;border:1px solid var(--borda);border-radius:16px;padding:12px 14px;display:flex;gap:4px}
.digitando i{width:7px;height:7px;border-radius:50%;background:#c9b9bc;animation:pulo 1s infinite}
.digitando i:nth-child(2){animation-delay:.15s}.digitando i:nth-child(3){animation-delay:.3s}
@keyframes pulo{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-4px)}}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.msg{animation:none}.digitando i{animation:none}}
footer{padding:10px 12px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--borda);background:#fff;min-height:64px}
.opcoes{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.opcoes button{border:1.5px solid var(--vinho);background:#fff;color:var(--vinho);border-radius:99px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer;font-size:14px}
.opcoes button:hover{background:var(--vinho-claro)}
.opcoes button.destaque{background:var(--vinho);color:#fff}
.opcoes.siglas button{padding:8px 12px;font-size:13.5px}
.opcoes.notas button{font-size:24px;padding:6px 10px;border-color:var(--borda)}
.entrada{display:flex;gap:8px;align-items:flex-end}
.entrada input,.entrada textarea{flex:1;font:inherit;padding:11px 14px;border:1px solid var(--borda);border-radius:22px;resize:none;outline:none;max-height:120px}
.entrada input:focus,.entrada textarea:focus{border-color:var(--vinho)}
.enviar{width:44px;height:44px;border-radius:50%;border:0;background:var(--vinho);color:#fff;font-size:18px;cursor:pointer;flex:none}
.aviso{font-size:12px;color:#b42318;margin:0 0 6px 6px}
.fim{text-align:center;color:var(--muted);font-size:13px;padding:8px}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--vinho);outline-offset:2px}
</style>

    <div class="logo"><img src="favicon.svg" alt=""></div>

</div>

};
const L = T[LANG];
document.getElementById('titulo').textContent = L.title;
document.getElementById('fechar').setAttribute('aria-label', L.close);

/* ---------- Central / Firebase (sem alteração no que é gravado) ---------- */
const DEMO = !FIREBASE_CONFIG;
const EMBUTIDO = window.self !== window.top || P.has('embed');
if(EMBUTIDO) document.documentElement.classList.add('embutido');
const LS = 'central-atendimento-demo';
let db = null;
if(!DEMO){ firebase.initializeApp(FIREBASE_CONFIG); db = firebase.firestore(); }

const chat = document.getElementById('chat'), rodape = document.getElementById('rodape');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const espera = ms => new Promise(r => setTimeout(r, ms));
const C = {nome:'', evento:'', contato:''};
const pn = () => C.nome.trim().split(/\s+/)[0] || '';
const rolar = () => chat.scrollTop = chat.scrollHeight;

/* ---------- eventos (mesmos dados do calendário) ---------- */
let EVENTOS = [];
const carregar = fetch('eventos.json', {cache:'no-cache'}).then(r => r.ok ? r.json() : null).then(d => { EVENTOS = (d && d.eventos) || []; }).catch(() => {});
const nomeEv = e => e.nome[LANG] || e.nome.pt;
const nomePt = e => e.nome.pt;
const localEv = e => e.local[LANG] || e.local.pt || '';
const hojeISO = () => new Date(Date.now() - 3 * 3600e3).toISOString().slice(0, 10); // horário de Brasília
const dt = iso => new Date(iso + 'T12:00:00Z');
const fmtDia = new Intl.DateTimeFormat(LOCALE[LANG], {day:'numeric', month:'long', timeZone:'UTC'});
const fmtSem = new Intl.DateTimeFormat(LOCALE[LANG], {weekday:'long', timeZone:'UTC'});
function periodo(e){
  if(e.ini === e.fim) return fmtDia.format(dt(e.ini));
  try { return fmtDia.formatRange(dt(e.ini), dt(e.fim)); } catch(_) { return fmtDia.format(dt(e.ini)) + ' – ' + fmtDia.format(dt(e.fim)); }
}
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const semana = e => cap(fmtSem.format(dt(e.ini))) + (e.ini === e.fim ? '' : ' – ' + fmtSem.format(dt(e.fim)));
const proximos = () => EVENTOS.filter(e => e.fim >= hojeISO());

function cartao(e){
  const hoje = hojeISO();
  const dias = Math.round((dt(e.ini) - dt(hoje)) / 864e5);
  const quando = e.fim < hoje ? `<div class="obs">${esc(L.past)}</div>` : e.ini <= hoje ? `<span class="falta">${esc(L.now)}</span>` : `<span class="falta">${esc(L.left(dias))}</span>`;
  const insc = e.inscricao === null ? `<div class="obs">${esc(L.noReg)}</div>`
    : e.inscricao ? '' : `<div class="obs">${esc(L.regSoon)}</div>`;
  const botoesLink = [
    e.inscricao ? `<a class="link-btn forte" href="${esc(e.inscricao)}" target="_blank" rel="noopener">${esc(L.regBtn)}</a>` : '',
    `<a class="link-btn" href="${CALENDARIO_URL}#evento-${esc(e.id)}" target="_blank" rel="noopener">${esc(L.seeCal)}</a>`
  ].join('');
  return `<div class="ev"><div class="sigla">${esc(e.sigla)}</div><div class="nome">${esc(nomeEv(e))}</div>
    <div class="data">${esc(periodo(e))}</div><div class="linha">${esc(semana(e))}</div>
    <div class="linha">📍 ${esc(localEv(e) || L.tbd)}</div>${quando}${insc}<div class="links">${botoesLink}</div></div>`;
}

/* ---------- demonstração automática (#auto, só em português) ---------- */
const AUTO = location.hash === '#auto' && LANG === 'pt' ? ['Maria Souza','Inscrição e pagamento','CMNE','Confirmar meu pagamento','Fiz o Pix ontem à noite, no nome de Maria Souza, e ainda não chegou a confirmação.','(85) 90000-0006'] : null;

/* ---------- peças do chat ---------- */
async function bot(html, pausa){
  const d = document.createElement('div'); d.className = 'digitando'; d.innerHTML = '<i></i><i></i><i></i>';
  chat.appendChild(d); rolar();
  await espera(pausa ?? Math.min(1400, 450 + html.replace(/<[^>]+>/g,'').length * 9));
  d.remove();
  const m = document.createElement('div'); m.className = 'msg bot'; m.innerHTML = html;
  chat.appendChild(m); rolar();
}
function eu(t){ const m = document.createElement('div'); m.className = 'msg eu'; m.textContent = t; chat.appendChild(m); rolar(); }

/* lista: textos dos botões; devolve o índice escolhido */
function botoes(lista, classe, destaque){
  return new Promise(res => {
    rodape.innerHTML = `<div class="opcoes ${classe||''}">${lista.map((o,i) => `<button data-i="${i}"${i === destaque ? ' class="destaque"' : ''}>${esc(o)}</button>`).join('')}</div>`;
    const escolher = i => { rodape.innerHTML = ''; eu(lista[i]); res(i); };
    rodape.querySelectorAll('button').forEach(b => b.onclick = () => escolher(+b.dataset.i));
    if(AUTO && AUTO.length){ const v = AUTO.shift(); setTimeout(() => escolher(Math.max(0, lista.indexOf(v))), 900); }
  });
}
function texto(ph, {tipo='text', longo=false, valida} = {}){
  return new Promise(res => {
    rodape.innerHTML = `<div class="aviso" id="aviso"></div><div class="entrada">${longo
      ? `<textarea id="campo" rows="2" placeholder="${esc(ph)}"></textarea>`
      : `<input id="campo" type="${tipo}" placeholder="${esc(ph)}" autocomplete="off">`}<button class="enviar" id="env" aria-label="${esc(L.send)}">➤</button></div>`;
    const campo = document.getElementById('campo');
    const enviar = () => {
      const v = campo.value.trim(); if(!v) return;
      const erro = valida && valida(v);
      if(erro){ document.getElementById('aviso').textContent = erro; return; }
      rodape.innerHTML = ''; eu(v); res(v);
    };
    document.getElementById('env').onclick = enviar;
    campo.onkeydown = e => { if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); enviar(); } };
    if(AUTO && AUTO.length){ const v = AUTO.shift(); setTimeout(() => { campo.value = v; enviar(); }, 1100); }
    else campo.focus();
  });
}

/* ---------- gravar na Central ---------- */
async function salvar(d){
  const agora = Date.now(), resolvido = d.status === 'resolvido';
  const c = {
    num:null, protocolo:agora.toString(36).slice(-5).toUpperCase(),
    nome:C.nome, contato:C.contato, canal:d.canal, evento:C.evento, assunto:d.assunto,
    prioridade:d.prioridade || 'normal', status:d.status,
    mensagem:d.mensagem + (LANG !== 'pt' ? `\n\n[Idioma do atendimento: ${LANG}]` : ''),
    responsavel:'', notas:[],
    criadoEm:agora, atualizadoEm:agora, primeiraRespostaEm:resolvido ? agora : null, resolvidoEm:resolvido ? agora : null,
    satisfacao:d.satisfacao || null
  };
  try{
    if(DEMO){
      let m = null; try { m = JSON.parse(localStorage.getItem(LS)); } catch(e){}
      m = m || {chamados:[], cfg:null};
      c.id = 'p' + agora; c.num = Math.max(0, ...m.chamados.map(x => x.num || 0)) + 1;
      m.chamados.unshift(c);
      try { localStorage.setItem(LS, JSON.stringify(m)); } catch(e){}
    } else {
      await db.collection('chamados').add(c);
    }
  } catch(e){ console.error(e); }
  return c.num || c.protocolo;
}

/* ---------- caminhos ---------- */
async function resolveu(assunto, caminho){
  await bot(esc(L.resolved));
  const r = await botoes([L.yes, L.no]);
  if(r === 1) return humano(L.missing, assunto);
  await bot(esc(L.rate(pn())));
  const caras = ['😞','🙁','😐','🙂','😍'];
  const n = await botoes(caras, 'notas') + 1;
  await salvar({status:'resolvido', canal:'Autoatendimento', assunto, mensagem:'Resolvido no autoatendimento: ' + caminho, satisfacao:{nota:n, comentario:'', em:Date.now()}});
  await bot(esc(L.thanks));
  fim();
}

async function humano(pergunta, assunto, prioridade, extra){
  await bot(esc(pergunta));
  let msg = await texto(L.writeHere, {longo:true});
  if(extra) msg += '\n\n' + extra;
  const atencao = prioridade === 'atencao' || /pag|caiu|confirm|vaga|esgot|urgente|pay|refund/i.test(msg);
  if(!FIREBASE_CONFIG && WHATSAPP_COORD){
    // sem Central ligada: entrega o pedido pronto no WhatsApp da coordenação
    await salvar({status:'novo', canal:'Link de atendimento', assunto, prioridade: atencao ? 'atencao' : 'normal', mensagem:msg});
    const txt = `Olá, graça e paz! Sou ${C.nome}.\nAssunto: ${assunto}${C.evento && C.evento !== 'Geral / Outro' ? ' — ' + C.evento : ''}${LANG !== 'pt' ? `\nIdioma: ${LANG}` : ''}\n\n${msg}`;
    await bot(`${esc(L.zapReady(pn()))}<br><a class="link-btn forte" href="https://wa.me/${WHATSAPP_COORD}?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener">${esc(L.zapBtn)}</a>`);
    await bot(esc(L.zapWait));
    fim(); return;
  }
  await bot(esc(L.askPhone));
  C.contato = await texto('(00) 00000-0000', {tipo:'tel', valida: v => v.replace(/\D/g,'').length < 10 ? L.phoneErr : ''});
  const prot = await salvar({status:'novo', canal:'Link de atendimento', assunto, prioridade: atencao ? 'atencao' : 'normal', mensagem:msg});
  await bot(L.protocol(esc(pn()), esc(prot)));
  await bot(esc(L.noRepeat));
  fim();
}

function fim(){
  rodape.innerHTML = `<div class="fim">${esc(L.ended)} · <a href="#" id="denovo">${esc(L.restart)}</a></div>`;
  document.getElementById('denovo').onclick = e => { e.preventDefault(); location.hash = ''; location.reload(); };
}

/* escolhe um evento pelas siglas; devolve o evento ou null (outro / ver todos) */
async function escolherEvento(pergunta, extra){
  await bot(esc(pergunta));
  const lista = proximos();
  const i = await botoes([...lista.map(e => e.sigla), extra], 'siglas');
  return i < lista.length ? lista[i] : null;
}

async function mostrarEvento(e){
  C.evento = nomePt(e) + ' 2027';
  const aviso = AVISOS.find(a => a.nome === nomePt(e) && (!a.ate || a.ate >= hojeISO()));
  await bot(cartao(e), 900);
  if(aviso) await bot(esc(aviso.info));
  await bot(`${esc(L.prog)}<br><a class="link-btn" href="${PORTAL}" target="_blank" rel="noopener">${esc(L.openPortal)}</a>`);
  return resolveu('Datas / Calendário', 'data e local: ' + e.sigla);
}

async function iniciar(){
  await carregar;
  const atual = EVENTOS.find(e => e.id === P.get('ev') && e.fim >= hojeISO());

  await bot(esc(L.hello), 500);
  await bot(esc(L.intro));
  C.nome = await texto(L.namePh);

  await bot(esc(L.nice(pn())));
  const ops = [L.optDates, L.optReg, L.optRefund, L.optCaravan, L.optOther];
  if(atual) ops.unshift(L.about(atual.sigla, atual.masc));
  let a = await botoes(ops, '', atual ? 0 : -1);
  if(atual){ if(a === 0) return mostrarEvento(atual); a -= 1; }

  if(a === 0){ // datas e locais
    C.evento = 'Geral / Outro';
    if(!EVENTOS.length){
      await bot(`${esc(L.calDetails)}<br><a class="link-btn forte" href="${CALENDARIO_URL}" target="_blank" rel="noopener">${esc(L.openCal)}</a>`);
      return resolveu('Datas / Calendário', 'datas de 2027 (link)');
    }
    const e = await escolherEvento(L.whichEvent, L.seeAll);
    if(e) return mostrarEvento(e);
    await bot(esc(L.allIntro), 500);
    await bot('<ul class="agenda">' + EVENTOS.map(e => `<li><b>${esc(e.sigla)}</b> · ${esc(periodo(e))}<span>${esc(nomeEv(e))} — ${esc(localEv(e) || L.tbd)}</span></li>`).join('') + '</ul>', 1200);
    await bot(`${esc(L.calDetails)}<br><a class="link-btn" href="${CALENDARIO_URL}" target="_blank" rel="noopener">${esc(L.openCal)}</a>`);
    return resolveu('Datas / Calendário', 'datas de 2027');
  }

  if(a === 1){ // inscrição
    const e = atual || await escolherEvento(L.regWhich, L.otherEvent);
    C.evento = e ? nomePt(e) + ' 2027' : 'Geral / Outro';
    await bot(esc(L.regWhat));
    const b = await botoes(L.regOpts);
    if(b === 0){
      if(e && e.inscricao) await bot(`${esc(L.regLink(e.sigla))}<br><a class="link-btn forte" href="${esc(e.inscricao)}" target="_blank" rel="noopener">${esc(L.regBtn)}</a>`);
      else if(e && e.inscricao === null) await bot(esc(L.noReg));
      else await bot(`${esc(L.prices)}<br><a class="link-btn" href="${PORTAL}" target="_blank" rel="noopener">${esc(L.seePrices)}</a>`);
      return resolveu('Inscrição / Pagamento', 'valores e lotes');
    }
    if(b === 2){
      await bot(esc(L.noDiscount));
      await bot(`<a class="link-btn" href="${(e && e.inscricao) || PORTAL}" target="_blank" rel="noopener">${esc(L.seeLots)}</a>`);
      return resolveu('Inscrição / Pagamento', 'desconto');
    }
    if(b === 1) return humano(L.payAsk, 'Inscrição / Pagamento', 'atencao');
    return humano(L.regAsk, 'Inscrição / Pagamento');
  }

  if(a === 2){ // reembolso
    C.evento = atual ? nomePt(atual) + ' 2027' : 'Geral / Outro';
    await bot(esc(L.refundAsk));
    const r = await botoes([L.yesOnly, L.noLonger]);
    await bot(`${r === 0 ? esc(L.refundYes) : L.refundNo}<br><a class="link-btn" href="${TIKETO_ZAP}" target="_blank" rel="noopener">${esc(L.tiketo)}</a>`);
    return resolveu('Reembolso / Titularidade', r === 0 ? 'reembolso até 7 dias' : 'troca de titularidade');
  }
  C.evento = atual ? nomePt(atual) + ' 2027' : 'Geral / Outro';
  if(a === 3) return humano(L.caravanAsk, 'Caravanas');
  return humano(L.otherAsk, 'Outros');
}
iniciar();
</script>
